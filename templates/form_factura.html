{% extends "base.html" %}
{% block title %}Nueva Factura{% endblock %}
{% block content %}
<h2>Registrar Factura</h2>
<form method="post">
  <input class="form-control" name="numero" placeholder="Número de Factura" required><br>
  <input class="form-control" type="date" name="fecha" required><br>
  <select class="form-control" name="cliente" required>
    <option value="">-- Selecciona Cliente --</option>
    {% for c in clientes %}
      <option value="{{ c.id_cliente }}">{{ c.nombre }} {{ c.apellido }}</option>
    {% endfor %}
  </select><br>
  <button class="btn btn-success" type="submit">Guardar</button>
</form>
{% endblock %}
