{% extends "base.html" %}
{% block title %}Editar Producto{% endblock %}
{% block content %}
<h2>Editar Producto</h2>
<form method="post">
  <input class="form-control" name="nombre" value="{{ producto.nombre }}" required><br>
  <input class="form-control" type="number" step="0.01" name="precio" value="{{ producto.precio }}" required><br>
  <input class="form-control" type="number" name="stock" value="{{ producto.stock }}" required><br>
  <button class="btn btn-primary" type="submit">Actualizar</button>
</form>
{% endblock %}
