{% extends "base.html" %}
{% block title %}Nuevo Cliente{% endblock %}
{% block content %}
<h2>Registrar Cliente</h2>
<form method="post">
  <input class="form-control" name="nombre" placeholder="Nombre" required><br>
  <input class="form-control" name="apellido" placeholder="Apellido" required><br>
  <input class="form-control" type="email" name="correo" placeholder="Correo" required><br>
  <input class="form-control" name="telefono" placeholder="Teléfono"><br>
  <button class="btn btn-success" type="submit">Guardar</button>
</form>
{% endblock %}
