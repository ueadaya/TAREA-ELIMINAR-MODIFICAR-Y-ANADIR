{% extends "base.html" %}
{% block title %}Nuevo Producto{% endblock %}
{% block content %}
<h2>Crear Producto</h2>
<form method="post">
  <input class="form-control" name="nombre" placeholder="Nombre" required><br>
  <input class="form-control" type="number" step="0.01" name="precio" placeholder="Precio" required><br>
  <input class="form-control" type="number" name="stock" placeholder="Stock" required><br>
  <button class="btn btn-success" type="submit">Guardar</button>
</form>
{% endblock %}
